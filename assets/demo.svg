<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <style>
    .term { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; font-size: 13px; }
    .prompt { fill: #7ee787; }
    .cmd { fill: #e6edf3; }
    .out { fill: #8b949e; }
    .highlight { fill: #58a6ff; }
    .success { fill: #7ee787; }
    .bg { fill: #0d1117; }
    .titlebar { fill: #161b22; }
    .dot { fill: #ff5f56; }
    .dot2 { fill: #ffbd2e; }
    .dot3 { fill: #27c93f; }
  </style>

  <!-- Terminal window -->
  <rect class="bg" width="700" height="400" rx="10"/>
  <rect class="titlebar" width="700" height="32" rx="10"/>
  <rect class="titlebar" y="22" width="700" height="10"/>
  <circle class="dot" cx="20" cy="16" r="6"/>
  <circle class="dot2" cx="40" cy="16" r="6"/>
  <circle class="dot3" cx="60" cy="16" r="6"/>
  <text x="350" y="20" text-anchor="middle" class="term out" font-size="12">Obscura MCP — Claude Desktop</text>

  <!-- Typing animation group -->
  <g>
    <!-- Line 1: User query -->
    <text x="20" y="60" class="term prompt">You:</text>
    <text x="70" y="60" class="term cmd">
      Research the latest developments in Rust async runtimes
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0s" fill="freeze"/>
    </text>

    <!-- Line 2: Tool call -->
    <text x="20" y="90" class="term highlight">
      → obscura research_web("rust async runtimes")
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
    </text>

    <!-- Line 3: Searching -->
    <text x="20" y="115" class="term out">
      🔍 Searching DuckDuckGo...
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.5s" fill="freeze"/>
    </text>

    <!-- Line 4: Found sources -->
    <text x="20" y="140" class="term out">
      📄 Found 5 sources: tokio.rs, areweasyncyet.rs, blog.rust-lang.org...
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.5s" fill="freeze"/>
    </text>

    <!-- Line 5: Fetching -->
    <text x="20" y="165" class="term out">
      ⬇ Fetching &amp; extracting content...
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.5s" fill="freeze"/>
    </text>

    <!-- Line 6: Ranking -->
    <text x="20" y="190" class="term out">
      📊 Ranking by BM25 relevance...
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.5s" fill="freeze"/>
    </text>

    <!-- Line 7: Aggregating -->
    <text x="20" y="215" class="term out">
      🔗 Aggregating claims &amp; detecting contradictions...
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="6.5s" fill="freeze"/>
    </text>

    <!-- Line 8: Done -->
    <text x="20" y="245" class="term success">
      ✓ Research complete — 5 sources, 42 claims, 3 contradictions
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="7.5s" fill="freeze"/>
    </text>

    <!-- Line 9: Result preview -->
    <text x="20" y="280" class="term highlight">Claude:</text>
    <text x="70" y="280" class="term cmd">
      Based on my research across 5 sources...
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="8.5s" fill="freeze"/>
    </text>

    <text x="20" y="305" class="term out">
      Rust async runtimes have evolved significantly. Tokio remains the
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="9s" fill="freeze"/>
    </text>
    <text x="20" y="325" class="term out">
      dominant choice for production, while async-std focuses on...
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="9.5s" fill="freeze"/>
    </text>

    <!-- Footer -->
    <text x="20" y="375" class="term out" font-size="11">
      Self-hosted • 4 MB RSS • No Chromium • No cloud API • No tokens
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="10.5s" fill="freeze"/>
    </text>
  </g>
</svg>