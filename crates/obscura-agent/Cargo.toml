[package]
name = "obscura-agent"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Autonomous AI-agent research orchestration, intelligent execution routing, and semantic distillation for Obscura"

[dependencies]
obscura-dom = { path = "../obscura-dom" }
obscura-extract = { path = "../obscura-extract" }
obscura-net = { path = "../obscura-net" }
obscura-telemetry = { path = "../obscura-telemetry" }
url = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
