[package]
name = "obscura"
version.workspace = true
edition.workspace = true
description = "Rust API for the Obscura headless browser"
readme = "README.md"
repository.workspace = true
license.workspace = true

[features]
default = ["api"]
api = ["obscura-browser", "obscura-net", "tokio"]
stealth = ["api", "obscura-browser/stealth"]
render = ["api", "obscura-browser/render"]

[dependencies]
obscura-browser = { path = "../obscura-browser", optional = true }
obscura-net = { path = "../obscura-net", optional = true }
anyhow = "1"
tokio = { version = "1", features = ["rt"], optional = true }
thiserror = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[example]]
name = "basic"
required-features = ["stealth"]
