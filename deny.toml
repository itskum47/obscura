# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny --all-features check --config deny.toml advisories bans licenses sources

[advisories]
# Real vulnerabilities fail the build. The advisories below are explicitly reviewed
# and accepted exceptions for transitive dependencies with no upstream fix available:
ignore = [
    "RUSTSEC-2025-0057", # fxhash unmaintained, transitive via selectors
    "RUSTSEC-2024-0436", # paste unmaintained, transitive via v8
    "RUSTSEC-2026-0206", # rustybuzz unmaintained, transitive via the pinned cosmic-text
    "RUSTSEC-2026-0192", # ttf-parser unmaintained, transitive via cosmic-text and the SVG stack
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained, transitive via async-nats 0.38.0 / rustls-native-certs
    # Transitive via async-nats 0.38.0 -> rustls 0.22 -> rustls-webpki 0.102.8.
    # Risk analysis & reachability:
    # 1. RUSTSEC-2026-0049 & RUSTSEC-2026-0104: CRL matching logic and empty bit string panic.
    #    Only reachable when parsing CRLs; async-nats TLS client does not configure or evaluate
    #    CRL distribution points.
    # 2. RUSTSEC-2026-0098 & RUSTSEC-2026-0099: Name constraint URI and wildcard validation bugs.
    #    Only reachable after signature verification of misissued public certificates with subtree
    #    constraints. NATS connection uses private cluster/mTLS roots, not public WebPKI hierarchy.
    # 3. RUSTSEC-2026-0382: Acceptance of distrusted emSign intermediates. NATS connections
    #    connect only to private cluster brokers, never public emSign endpoints. All external
    #    browser/web traffic is handled by reqwest/wreq using rustls-webpki 0.103.16.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
]

[bans]
# Duplicate transitive versions are build-time bloat, not a security issue, and
# are largely outside our control (deno_core / v8 / reqwest trees). Surface them
# without failing the build.
multiple-versions = "warn"
wildcards = "allow"

[licenses]
# Permissive allow-list enforced by the PR policy job.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8


[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
